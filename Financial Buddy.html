<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Financial Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f3ea;--card:#fffcf6;--sand:#e9dfcb;--lilac:#d9eee9;--orchid:#86c9bf;--violet:#0c7f82;--deep:#0a4a52;--ink:#2d2a26;--mute:#7a7061;--bad:#c62828;--ok:#2e7d4f;--in:#fffdf8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a14;--card:#2a241c;--sand:#43392c;--lilac:#1f4441;--orchid:#3f8f88;--violet:#45d6c8;--deep:#c6f6f0;--ink:#efe7d8;--mute:#b3a893;--bad:#ff8a80;--ok:#7fd1a0;--in:#231e17}}
:root[data-theme="dark"]{--bg:#1f1a14;--card:#2a241c;--sand:#43392c;--lilac:#1f4441;--orchid:#3f8f88;--violet:#45d6c8;--deep:#c6f6f0;--ink:#efe7d8;--mute:#b3a893;--bad:#ff8a80;--ok:#7fd1a0;--in:#231e17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Courier Prime",ui-monospace,monospace}
h1,h2,h3{font-family:"Special Elite","Courier Prime",monospace;font-weight:400;margin:0;color:var(--deep)}
header{padding:14px 20px;background:var(--card);border-bottom:1px solid var(--sand)}header h1{font-size:22px;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
section{background:var(--card);border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 2px 12px #8a6d3b1a}
section>h2{font-size:21px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input,select,button{font:inherit}
input,select{width:100%;padding:9px 11px;border:1.5px solid var(--sand);border-radius:10px;background:var(--in);color:var(--ink)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--violet);cursor:pointer}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
button{background:var(--violet);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700}
:root[data-theme="dark"] button,:root:not([data-theme="light"]) button{color:#082022}
button.ghost{background:var(--lilac);color:var(--deep)}button.x{background:none;color:var(--bad);padding:2px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.tag{background:var(--lilac);color:var(--deep);border-radius:99px;padding:3px 10px;font-size:12px}
.tag.bad{color:var(--bad)}.tag.ok{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.stat{background:var(--lilac);border-radius:14px;padding:10px 12px}.stat small{display:block;color:var(--mute);font-size:12px}.stat b{font-size:18px;color:var(--deep)}
.bar{height:8px;background:var(--sand);border-radius:99px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--violet)}
.debt{border:1.5px dashed var(--orchid);border-radius:14px;padding:12px;margin-bottom:12px}
.small{font-size:12px;color:var(--mute)}.empty{color:var(--mute)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--sand);white-space:nowrap}
th{font-size:12px;color:var(--mute)}td.n,th.n{text-align:right}tr.paid td{color:var(--mute);text-decoration:line-through}tr.paid td:first-child{text-decoration:none}
tr.next td{background:var(--lilac)}.od{color:var(--bad);font-weight:700}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--deep);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:50}
.gh td{background:var(--lilac);color:var(--deep);font-weight:700;border-bottom:0}
.stk{border:1.5px dashed var(--orchid);border-radius:12px;padding:8px 12px;margin-top:12px}.stk .row{padding:3px 0}
.stat.c{cursor:pointer}.dt{width:auto;padding:3px 6px;font-size:12px}td .nt{white-space:normal;min-width:130px;color:var(--mute);font-size:12px}
.mdl{position:fixed;inset:0;background:#0a2a2c88;display:none;place-items:center;z-index:40;padding:16px}.mdl.on{display:grid}.mc{background:var(--card);border-radius:18px;padding:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--lilac);border-radius:99px;padding:4px 10px;margin:0 4px 6px 0;font-size:13px;color:var(--deep);cursor:pointer}.chip input{width:16px;height:16px}
.sg{display:flex;flex-wrap:wrap;gap:18px}.sw{max-width:100%}
.slip{background:#fff;width:330px;max-width:100%;padding:18px 16px;font:13px/1.45 "Courier Prime",monospace;color:#222;border:1px dashed var(--orchid);border-radius:4px}
.slip h3{font-family:"Special Elite","Courier Prime",monospace;font-size:16px;text-align:center;color:#222}.slip .c{text-align:center;color:#777}.slip hr{border:0;border-top:1px dashed #bbb;margin:9px 0}
.slip .ln{display:flex;justify-content:space-between;gap:10px}.slip .ln span:last-child{white-space:nowrap}.slip .nm{text-align:center;font-weight:700;font-size:15px;margin-top:4px}.slip .tot{font-weight:700}
.slip .ln.paid{color:#a9a9a9;text-decoration:line-through;text-decoration-color:#c8c8c8}.slip .ln.sub{color:#999;padding-left:14px;font-size:12px}
@media print{body *{visibility:hidden}#slips,#slips *{visibility:visible}#slips{position:absolute;left:0;top:0;width:100%}#slips .noprint{display:none}.slip{border:0;margin:0 auto 20px;page-break-after:always;break-inside:avoid}.mdl{display:none!important}}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{display:flex;align-items:center;gap:8px}
.ic{width:1em;height:1em;flex:none}header h1 .ic{width:26px;height:26px;color:var(--violet)}.ic.sm{width:18px;height:18px;vertical-align:-3px;color:var(--violet)}
#auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}#auth button,#auth a.btn{padding:6px 12px;font-size:13px}
a.btn{display:inline-block;text-decoration:none;background:var(--lilac);color:var(--deep);border-radius:10px;font-weight:700}a.btn:hover,button.ghost:hover{background:var(--orchid)}
.hero{background:var(--card);border-radius:18px;padding:20px 20px 6px;margin-bottom:18px;box-shadow:0 2px 12px #8a6d3b1a}.hero h2{font-size:27px}.hero p{margin:4px 0 0;color:var(--mute)}.hero svg{width:100%;height:auto;display:block;margin-top:6px}
.stamp{width:56px;height:56px;border-radius:50%;border:2.5px double var(--violet);color:var(--violet);display:grid;place-items:center;font:400 18px "Special Elite",monospace;transform:rotate(-9deg);flex:none;background:var(--lilac)}
.plus{background:none;color:var(--violet);border:1.5px dashed var(--orchid);padding:3px 12px;font-weight:400;font-size:13px}.plus:hover{background:var(--lilac)}
.stat{background:var(--card);border:1.5px dashed var(--orchid)}.tag{background:var(--lilac)}
#toast{max-width:90%}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="coin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.4 0-2.5.8-2.5 1.9 0 2.6 5.2 1.4 5.2 4 0 1.1-1.2 1.9-2.7 1.9-1.2 0-2.2-.5-2.8-1.4M12 6.5V8M12 16v1.5"/></g></symbol>
<symbol id="wallet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="3.5" y="8" width="17" height="11" rx="2.5"/><path d="M16.5 13.5h4v2h-4a1 1 0 0 1 0-2z"/></g></symbol></defs></svg>
<header><h1 onclick="home()"><svg class="ic"><use href="#coin"/></svg>Financial Buddy</h1><div id="auth"><button class="ghost" onclick="exportAll()">Download my data</button><button class="ghost" onclick="$('#fi').click()">Open saved file</button><a class="btn" href="https://introvertdiary.github.io/travelbuddy/">← Travel Buddy</a></div></header><input type="file" id="fi" accept=".json,application/json" hidden onchange="importFile(this)"><div class="mdl" id="mdl" onclick="if(event.target===this)closeM()"><div class="mc" id="mc"></div></div>
<main id="app"></main><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const split=(t,n,i)=>{const b=r2(t/n);return i===n-1?r2(t-b*(n-1)):b};
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const pd=s=>new Date(s+"T00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3500)}
const ym=n=>n<=0?"none":(n>=12?Math.floor(n/12)+" yr ":"")+(n%12?n%12+" mo":"");
const T={exp:{bal:"Balance left",done:"Paid so far",left:"Payments left",od:"Overdue payments",nx:"Next due",set:"Settled",kinds:["Bank","Credit card","Person","Other expense"],ttl:"Set Up Expense Account",list:"Your expense list",add:"Add items",dl:"Due date (first payment)",sec:"Due dates",rec:"Installment",due:"due"},
 inc:{bal:"Left to receive",done:"Received so far",left:"Receipts left",od:"Late receipts",nx:"Next expected",set:"Received in full",kinds:["Employer","Client","Person","Other income"],ttl:"Set Up Income Account",list:"Your income list",add:"Add expected income",dl:"Expected date (first receipt)",sec:"Expected dates",rec:"Recurring monthly",due:"expected"}};
const sd=a=>a.side==="inc"?"inc":"exp";
const HERO=`<div class="hero"><h2>Where's the money going?</h2><p>Track what you owe, what you're owed and what comes due, then settle up with receipts.</p>
<svg viewBox="0 0 640 120" aria-hidden="true" style="color:var(--violet)"><ellipse cx="130" cy="30" rx="34" ry="10" style="fill:var(--sand)"/><ellipse cx="156" cy="24" rx="22" ry="9" style="fill:var(--sand)"/><ellipse cx="400" cy="100" rx="40" ry="10" style="fill:var(--sand)"/><ellipse cx="428" cy="94" rx="24" ry="9" style="fill:var(--sand)"/>
<path d="M44 98 C170 8 300 128 470 52 S585 28 598 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/>
<circle cx="300" cy="78" r="5" fill="#e9a23b"/><circle cx="470" cy="52" r="5" fill="#e9a23b"/>
<use href="#wallet" x="8" y="78" width="38" height="38"/><use href="#coin" x="580" y="4" width="40" height="40"/></svg></div>`;
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"$";
let editIdx=null,editIid=null;
let accts=[],stack=[],cur=null,showSum=false,people=[],sel=new Set(),cust={},spMode="e",incMe=false;
try{people=JSON.parse(localStorage.getItem("debtbuddy:people:v1")||"[]");if(!Array.isArray(people))people=[]}catch(e){people=[]}
function savePpl(){try{localStorage.setItem("debtbuddy:people:v1",JSON.stringify(people))}catch(e){}}
const plist=()=>[...new Set([...people,...accts.flatMap(a=>a.items.flatMap(i=>Object.keys(i.alloc||{})))])];
try{accts=JSON.parse(localStorage.getItem("debtbuddy:v2")||"[]");if(!Array.isArray(accts))accts=[]}catch(e){accts=[]}
function save(){try{localStorage.setItem("debtbuddy:v2",JSON.stringify(accts))}catch(e){toast("Could not save in this browser.")}}
function addM(y,m,d,i){const t=new Date(y,m-1+i,1),l=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(Math.min(d,l)).padStart(2,"0")}
const FQ={w:{n:"Weekly",h:28},b:{n:"Every 2 weeks",h:42},m:{n:"Monthly",h:62},q:{n:"Every 3 months",h:100},y:{n:"Yearly",h:370}};
const iso=t=>t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
const addD=(s,n)=>{const [y,m,d]=s.split("-").map(Number);return iso(new Date(y,m-1,d+n))};
function occ(y,m,d,f,i){if(f==="w"||f==="b")return iso(new Date(y,m-1,d+(f==="w"?7:14)*i));return addM(y,m,d,f==="y"?12*i:f==="q"?3*i:i)}
const shr=(it,v,i)=>it.rec?v:split(v,it.months,i);
const fname=it=>FQ[it.freq||"m"].n.toLowerCase();
const lbl=(it,p)=>it.rec?"recurring · "+fname(it):it.months>1?(p.i+1)+" of "+it.months+" · "+fname(it):"one-time";
function pays(it,lm){const f=it.freq||"m",[y,m,d]=it.due.split("-").map(Number),po=it.paidOn||[];
 if(!it.rec){const n=it.months,b=r2(it.amount/n);return Array.from({length:n},(_,i)=>({i,date:occ(y,m,d,f,i),amt:i===n-1?r2(it.amount-b*(n-1)):b,paid:!!it.paid[i],on:po[i]||""}))}
 let mx=-1;it.paid.forEach((v,i)=>{if(v)mx=i});const df=addD(today(),FQ[f].h),lim=lm&&lm>df?lm:df,out=[];
 for(let i=0;i<2000;i++){const dt=occ(y,m,d,f,i);if(it.until&&dt>it.until)break;if(dt>lim&&i>mx+1)break;out.push({i,date:dt,amt:it.amount,paid:!!it.paid[i],on:po[i]||""})}
 return out}
function asum(a){const rows=[];let ten=0;a.items.forEach(it=>{const p=pays(it);if(!it.rec){const u=p.filter(x=>!x.paid);if(u.length){const dd=Math.round((new Date(u[u.length-1].date+"T00:00")-new Date(today()+"T00:00"))/864e5);ten=Math.max(ten,Math.max(1,Math.ceil(dd/30.4)))}}p.forEach(x=>rows.push({it,p:x}))});
 const un=rows.filter(r=>!r.p.paid),tot=r2(rows.reduce((s,r)=>s+r.p.amt,0)),out=r2(un.reduce((s,r)=>s+r.p.amt,0)),t=today();
 return{rows,tot,out,paidAmt:r2(tot-out),left:un.length,ten,od:un.filter(r=>r.p.date<t).length,next:un.map(r=>r.p.date).sort()[0],pct:tot?100*(tot-out)/tot:0,hasRec:a.items.some(i=>i.rec),oo:r2(un.reduce((q,r)=>q+(r.it.who==="others"?Object.values(r.it.alloc||{}).reduce((z,v)=>z+shr(r.it,v,r.p.i),0):0),0)),fin:rows.length>0&&!un.length,last:rows.filter(r=>r.p.paid&&r.p.on).map(r=>r.p.on).sort().pop()||""}}
const card=(k,v,c)=>`<div class="stat${c?" c":""}"${c?` onclick="ovPop('${c}')"`:""}><small>${k}</small><b>${v}</b></div>`;
const monthB=()=>{const [y,m]=today().split("-").map(Number);return{s:iso(new Date(y,m,1)),e:iso(new Date(y,m+1,0)),label:new Date(y,m,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})}};
const sum=g=>g.length?`<div class="wrap"><table><tr><th>Account</th><th>Type</th><th class="n">Total</th><th class="n">${T[sd(g[0].a)].done.replace(" so far","")}</th><th class="n">${T[sd(g[0].a)].bal}</th><th>Next</th></tr>${g.map(({a,s})=>`<tr><td><a href="#" style="color:var(--violet)" onclick="openA('${a.id}');return false">${esc(a.name)}</a></td><td>${esc(a.kind)}</td><td class="n">${fmt(s.tot)}</td><td class="n">${fmt(s.paidAmt)}</td><td class="n">${fmt(s.out)}</td><td>${s.next?pd(s.next):"–"}</td></tr>`).join("")}<tr><td colspan="2"><b>Total</b></td><td class="n"><b>${fmt(g.reduce((q,x)=>q+x.s.tot,0))}</b></td><td class="n"><b>${fmt(g.reduce((q,x)=>q+x.s.paidAmt,0))}</b></td><td class="n"><b>${fmt(g.reduce((q,x)=>q+x.s.out,0))}</b></td><td></td></tr></table></div>`:`<p class="empty">None yet.</p>`;
function ovData(){const nb=monthB(),next=[],inst=[];accts.filter(a=>sd(a)==="exp").forEach(a=>a.items.forEach(it=>{const ps=pays(it,nb.e);ps.forEach(p=>{if(!p.paid&&p.date>=nb.s&&p.date<=nb.e)next.push({a,it,p})});if(!it.rec&&it.months>1){const u=ps.filter(p=>!p.paid);if(u.length)inst.push({a,it,u})}}));next.sort((x,y)=>x.p.date>y.p.date?1:-1);return{nb,next,inst}}
function ovPop(k){const O=ovData();let h;
 if(k==="next"){const t=r2(O.next.reduce((q,x)=>q+x.p.amt,0));h=`<h2>Payable in ${O.nb.label}</h2>${O.next.length?`<div class="wrap"><table><tr><th>Due</th><th>Item</th><th class="n">Amount</th></tr>${O.next.map(x=>`<tr><td>${pd(x.p.date)}</td><td>${esc(x.it.desc)}<div class="nt">${esc(x.a.name)} · ${lbl(x.it,x.p)}</div></td><td class="n">${fmt(x.p.amt)}</td></tr>`).join("")}<tr><td colspan="2"><b>Total</b></td><td class="n"><b>${fmt(t)}</b></td></tr></table></div>`:`<p class="empty">Nothing is due that month.</p>`}`}
 else if(k==="inst"){const am=x=>r2(x.u.reduce((q,p)=>q+p.amt,0)),t=r2(O.inst.reduce((q,x)=>q+am(x),0));h=`<h2>Still on installment</h2>${O.inst.length?`<div class="wrap"><table><tr><th>Item</th><th>Left</th><th class="n">Amount left</th><th>Last payment</th></tr>${O.inst.map(x=>`<tr><td>${esc(x.it.desc)}<div class="nt">${esc(x.a.name)} · ${fname(x.it)}</div></td><td>${x.u.length} of ${x.it.months}</td><td class="n">${fmt(am(x))}</td><td>${pd(x.u[x.u.length-1].date)}</td></tr>`).join("")}<tr><td colspan="2"><b>Total</b></td><td class="n"><b>${fmt(t)}</b></td><td></td></tr></table></div>`:`<p class="empty">No installments left.</p>`}`}
 else h=`<h2>Expenses per account</h2>${sum(accts.filter(a=>sd(a)==="exp").map(a=>({a,s:asum(a)})))}`;
 $("#mc").innerHTML=h+`<div style="margin-top:12px"><button class="ghost" onclick="closeM()">Close</button></div>`;$("#mdl").classList.add("on")}
function home(){cur=null;stack=[];editIdx=null;editIid=null;const S=accts.map(a=>({a,s:asum(a)})),E=S.filter(x=>sd(x.a)==="exp"),I=S.filter(x=>sd(x.a)==="inc");
 const O=ovData(),eo=r2(E.reduce((q,x)=>q+x.s.out,0)),nt=r2(O.next.reduce((q,x)=>q+x.p.amt,0)),ins=r2(O.inst.reduce((q,x)=>q+x.u.reduce((z,p)=>z+p.amt,0),0));
 const lst=(g,side)=>`<section><h2><svg class="ic sm"><use href="#coin"/></svg> ${T[side].list}</h2>${g.length?g.map(({a,s})=>`<div class="debt"><div class="row sp"><div><b>${esc(a.name)}</b> <span class="tag">${esc(a.kind)}</span> ${s.od?`<span class="tag bad">${s.od} ${side==="inc"?"late":"overdue"}</span>`:""}${s.fin?`<span class="tag ok">${T[side].set}${s.last?" on "+pd(s.last):""}</span>`:""}</div>
  <div class="row"><button class="ghost" onclick="openA('${a.id}')">Open</button><button class="x" onclick="delA('${a.id}')">Delete</button></div></div>
  <div class="bar"><i style="width:${s.pct}%"></i></div><div class="small">${a.items.length?`${T[side].bal} <b>PHP ${fmt(s.out)}</b> · ${s.left} ${side==="inc"?"receipt":"payment"}${s.left===1?"":"s"} left${s.next?` · next ${pd(s.next)}`:""}`:"No items yet"}</div></div>`).join(""):`<p class="empty">Nothing yet. Create one above.</p>`}</section>`;
 const setup=side=>`<section><h2>${T[side].ttl}</h2><div class="grid"><div><label>Name</label><input id="nm-${side}"></div><div><label>Type</label><select id="kd-${side}">${T[side].kinds.map(k=>`<option>${k}</option>`).join("")}</select></div></div><div style="margin-top:12px"><button onclick="addAcct('${side}')">Create</button></div></section>`;
 $("#app").innerHTML=HERO+`<section><h2>Overview</h2><div class="stats">${card("Expenses balance left","PHP "+fmt(eo),"bal")}${card("Payable next month ("+O.nb.label+")","PHP "+fmt(nt),"next")}${card("Still on installment","PHP "+fmt(ins),"inst")}</div>
  <p class="small">Tap a card to see the details.</p></section>${setup("exp")}${setup("inc")}${lst(E,"exp")}${lst(I,"inc")}${rcpt(accts,"All accounts")}`}
function addAcct(side){const n=$("#nm-"+side).value.trim();if(!n)return toast("Add a name.");const a={id:uid(),name:n,kind:$("#kd-"+side).value,side,items:[]};accts.push(a);save();openA(a.id)}
function delA(id){if(!confirm("Delete this and all its items?"))return;accts=accts.filter(x=>x.id!==id);save();home()}
function openA(id){const a=accts.find(x=>x.id===id);if(!a)return home();editIdx=null;editIid=null;if(cur!==id){stack=[];sel=new Set();cust={}}cur=id;const s=asum(a),L=T[sd(a)];
 $("#app").innerHTML=`<section><div class="row sp"><div class="row" style="flex-wrap:nowrap"><div class="stamp">${esc(ini(a.name))}</div><div><h2>${esc(a.name)}</h2><span class="tag">${esc(a.kind)}</span> ${s.fin?`<span class="tag ok">${L.set}${s.last?" on "+pd(s.last):""}</span>`:""}</div></div><button class="ghost" onclick="home()">All</button></div>
  <div class="bar"><i style="width:${s.pct}%"></i></div><div class="stats" style="margin-top:10px">${card(L.bal,"PHP "+fmt(s.out))}${card(L.done,"PHP "+fmt(s.paidAmt))}${card(L.left,s.left)}${card(L.nx,s.next?pd(s.next):"–")}${card(L.od,`<span class="${s.od?"od":""}">${s.od}</span>`)}${card("Longest tenure left",s.ten?ym(s.ten):s.hasRec?"Ongoing":"none")}${s.oo>0?card("Others' share left","PHP "+fmt(s.oo)):""}</div></section>
 <section><h2>${L.add}</h2><p class="small">Set the date, stack as many items as fall on it, then add them all at once.</p>
  <div class="grid"><div><label>${L.dl}</label><input id="du" type="date" value="${today()}"></div></div>
  <div id="eb"></div><div class="grid" style="margin-top:10px"><div style="grid-column:span 2"><label>Item</label><input id="ds"></div>
  <div><label id="al">Amount (PHP)</label><input id="am" type="number" step="any" inputmode="decimal" oninput="rem()"></div>
  <div><label>Payment</label><select id="pk" onchange="payUI()"><option value="o">One-time</option><option value="i">Installment (set number of payments)</option><option value="r">Recurring (repeats until stopped)</option></select></div>
  <div id="fw" style="display:none"><label>Repeats</label><select id="fq">${Object.entries(FQ).map(([k,v])=>`<option value="${k}"${k==="m"?" selected":""}>${v.n}</option>`).join("")}</select></div>
  <div id="mw" style="display:none"><label>Number of payments</label><input id="mo" type="number" inputmode="numeric" value="12"></div>
  <div id="ew" style="display:none"><label>Ends on (optional)</label><input id="en" type="date"></div>
  ${sd(a)==="exp"?`<div><label>Whose expense?</label><select id="wh" onchange="paintWho()"><option value="m">Mine</option><option value="o">Others</option></select></div>`:""}<div id="who" style="grid-column:1/-1"></div>
  <div style="grid-column:1/-1"><label>Notes or remarks (optional)</label><input id="nt"></div></div>
  <div style="margin-top:10px"><button class="plus" id="sb" onclick="stage()">+ Add to stack</button> <button class="x" id="cb" style="display:none" onclick="cancelEdit()">Cancel edit</button></div><div id="stk"></div></section>
 <section><h2>${L.sec}</h2><p class="small">Tick a line once ${sd(a)==="inc"?"received":"paid"}. The date is set to today and can be changed.</p>${ledger(a)}</section>${rcpt([a],a.name)}`;paint();paintWho()}
function mkAlloc(am){const w=$("#wh");if(!w||w.value!=="o")return{who:"me",alloc:{}};
 const P=plist(),names=[...sel].filter(n=>P.includes(n));if(!names.length)throw"Pick at least one person.";const al={};
 if(spMode==="e"){const n=names.length+(incMe?1:0),b=r2(am/n);names.forEach(x=>al[x]=b);if(!incMe)al[names[names.length-1]]=r2(am-b*(names.length-1))}
 else{names.forEach(x=>{const v=r2(+cust[x]||0);if(v>0)al[x]=v});const t=r2(Object.values(al).reduce((q,v)=>q+v,0));if(!t)throw"Enter an amount for at least one person.";if(t>am+0.005)throw"The amounts add up to more than the item amount."}
 return{who:"others",alloc:al}}
function payUI(){const k=$("#pk").value;$("#fw").style.display=k==="o"?"none":"";$("#mw").style.display=k==="i"?"":"none";$("#ew").style.display=k==="r"?"":"none";$("#al").textContent=k==="i"?"Total amount (PHP), split across payments":k==="r"?"Amount each time (PHP)":"Amount (PHP)"}
function stage(){const d=$("#ds").value.trim(),k=$("#pk").value,m=k==="i"?Math.round(+$("#mo").value):1,am=+$("#am").value,f=k==="o"?"m":$("#fq").value,un=k==="r"?$("#en").value:"";
 if(!d||!(am>0)||!(m>=1&&m<=600))return toast("Add an item name, an amount and the number of payments if it is an installment.");
 if(un&&$("#du").value&&un<$("#du").value)return toast("The end date is before the first date.");
 let w;try{w=mkAlloc(am)}catch(e){return toast(typeof e==="string"?e:"Check the split.")}
 const o={id:editIdx!=null?stack[editIdx].id:uid(),desc:d,amount:am,months:m,rec:k==="r",freq:f,until:un,note:$("#nt").value.trim(),...w};if(editIdx!=null){stack[editIdx]=o;editIdx=null}else stack.push(o);$("#ds").value="";$("#am").value="";$("#nt").value="";cust={};sbUI();paint();paintWho();$("#ds").focus()}
function sbUI(){const b=$("#sb");if(!b)return;const sv=editIid!=null;b.style.display=sv?"none":"";b.textContent=editIdx!=null?"Save changes":"+ Add to stack";$("#cb").style.display=!sv&&editIdx!=null?"":"none"}
function fillForm(x){$("#ds").value=x.desc;$("#am").value=x.amount;$("#nt").value=x.note||"";$("#pk").value=x.rec?"r":x.months>1?"i":"o";payUI();$("#fq").value=x.freq||"m";if(x.months>1)$("#mo").value=x.months;$("#en").value=x.until||"";
 const w=$("#wh");if(w){w.value=x.who==="others"?"o":"m";if(x.who==="others"){sel=new Set(Object.keys(x.alloc));cust={};Object.entries(x.alloc).forEach(([n,v])=>cust[n]=String(v));spMode="c"}}paintWho()}
function editStk(i){editIid=null;$("#eb").innerHTML="";editIdx=i;fillForm(stack[i]);sbUI();paint();$("#ds").scrollIntoView({block:"center"});$("#ds").focus()}
function editSaved(iid){const a=accts.find(x=>x.id===cur),it=a&&a.items.find(x=>x.id===iid);if(!it)return;editIdx=null;editIid=iid;fillForm(it);$("#du").value=it.due;
 $("#eb").innerHTML=`<div class="stk" style="margin:0 0 10px"><b>Editing saved item: ${esc(it.desc)}</b><div class="small">Payments you already ticked stay ticked. Change the fields below, then save.</div><div class="row" style="margin-top:6px"><button onclick="saveSaved()">Save changes</button><button class="x" onclick="cancelSaved()">Cancel</button></div></div>`;sbUI();paint();$("#eb").scrollIntoView({block:"center"})}
function cancelSaved(){editIid=null;$("#eb").innerHTML="";$("#ds").value="";$("#am").value="";$("#nt").value="";cust={};paintWho();sbUI()}
function saveSaved(){const a=accts.find(x=>x.id===cur),it=a&&a.items.find(x=>x.id===editIid);if(!it)return;
 const d=$("#ds").value.trim(),k=$("#pk").value,m=k==="i"?Math.round(+$("#mo").value):1,am=+$("#am").value,f=k==="o"?"m":$("#fq").value,un=k==="r"?$("#en").value:"",du=$("#du").value;
 if(!d||!(am>0)||!(m>=1&&m<=600)||!du)return toast("Add an item name, an amount, the date and the number of payments if it is an installment.");
 if(un&&un<du)return toast("The end date is before the first date.");
 let w;try{w=mkAlloc(am)}catch(e){return toast(typeof e==="string"?e:"Check the split.")}
 Object.assign(it,{desc:d,amount:am,months:m,rec:k==="r",freq:f,until:un,note:$("#nt").value.trim(),due:du,...w});
 if(k!=="r"){it.paid=it.paid.slice(0,m);it.paidOn=(it.paidOn||[]).slice(0,m)}
 save();editIid=null;openA(cur);toast("Changes saved")}
function cancelEdit(){editIdx=null;$("#ds").value="";$("#am").value="";$("#nt").value="";cust={};paintWho();sbUI();paint()}
function selP(i,on){const n=plist()[i];on?sel.add(n):sel.delete(n);paintWho()}
function addP(){const el=$("#np"),n=el.value.trim().slice(0,60);if(!n)return;if(plist().some(x=>x.toLowerCase()===n.toLowerCase()))return toast("That name is already in the list.");people.push(n);sel.add(n);savePpl();paintWho()}
function rmP(i){const n=plist()[i];people=people.filter(x=>x!==n);sel.delete(n);savePpl();paintWho()}
function rem(){const el=$("#rm");if(!el)return;const am=+$("#am").value||0,t=r2([...sel].reduce((q,n)=>q+(+cust[n]||0),0));el.className="small"+(am&&t>am?" od":"");el.textContent="Allocated PHP "+fmt(t)+(am?" · Mine (remainder) PHP "+fmt(am-t):"")}
function paintWho(){const el=$("#who"),w=$("#wh");if(!el)return;if(!w||w.value!=="o"){el.innerHTML="";return}
 const P=plist(),used=new Set(accts.flatMap(a=>a.items.flatMap(i=>Object.keys(i.alloc||{}))));
 el.innerHTML=`<div>${P.map((n,i)=>`<span><label class="chip"><input type="checkbox" ${sel.has(n)?"checked":""} onchange="selP(${i},this.checked)">${esc(n)}</label>${used.has(n)?"":`<button class="x" onclick="rmP(${i})" aria-label="Remove ${esc(n)}">✕</button>`}</span>`).join("")||`<span class="small">No people yet. Add one below.</span>`}</div>
 <div class="row" style="margin:4px 0 8px"><input id="np" style="max-width:200px" onkeydown="if(event.key==='Enter')addP()" aria-label="New person's name"><button class="plus" onclick="addP()">+ Add person</button></div>
 <div class="grid"><div><label>Split</label><select onchange="spMode=this.value;paintWho()"><option value="e" ${spMode==="e"?"selected":""}>Divide equally</option><option value="c" ${spMode==="c"?"selected":""}>Custom amounts</option></select></div></div>
 ${spMode==="e"?`<label style="margin-top:8px"><input type="checkbox" style="width:auto" ${incMe?"checked":""} onchange="incMe=this.checked"> Include me in the split</label>`:`<div style="margin-top:8px">${[...sel].map(n=>`<div class="row" style="margin-bottom:6px"><span style="min-width:110px">${esc(n)}</span><input type="number" step="any" style="max-width:150px" value="${esc(cust[n]??"")}" oninput="cust[plist()[${P.indexOf(n)}]]=this.value;rem()" aria-label="Amount for ${esc(n)}"></div>`).join("")||`<span class="small">Select people above.</span>`}<div class="small" id="rm"></div></div>`}`;rem()}
function paint(){const el=$("#stk");if(!el)return;el.innerHTML=stack.length?`<div class="stk"><b>Stack</b>${stack.map((x,i)=>`<div class="row sp"><span>${esc(x.desc)} <span class="small">${x.rec?fname(x)+" · PHP "+fmt(x.amount)+" each"+(x.until?" until "+pd(x.until):""):x.months>1?x.months+" payments, "+fname(x)+" · PHP "+fmt(x.amount/x.months)+" each":"one-time"}${x.who==="others"?" · for "+Object.entries(x.alloc).map(([n,v])=>esc(n)+" "+fmt(v)).join(", "):""}${x.note?" · "+esc(x.note):""}</span></span><span>PHP ${fmt(x.amount)} <button class="ghost" style="padding:2px 10px;font-size:12px" onclick="editStk(${i})">${editIdx===i?"Editing…":"Edit"}</button> <button class="x" onclick="unstage(${i})" aria-label="Remove">✕</button></span></div>`).join("")}
 <div class="row sp" style="margin-top:6px"><b>Together on first date: PHP ${fmt(stack.reduce((s,x)=>s+x.amount/x.months,0))}</b><button onclick="commit()">Add all</button></div></div>`:""}
function unstage(i){stack.splice(i,1);if(editIdx===i)editIdx=null;else if(editIdx!=null&&i<editIdx)editIdx--;sbUI();paint()}
function commit(){if($("#ds").value.trim()&&+$("#am").value>0)stage();const du=$("#du").value,a=accts.find(x=>x.id===cur);
 if(!du)return toast("Set the date.");if(!stack.length)return toast("Stack at least one item first.");
 stack.forEach(x=>a.items.push({...x,due:du,paid:[],paidOn:[]}));const n=stack.length;stack=[];save();openA(cur);toast(n+" item"+(n===1?"":"s")+" added")}
const fl=r=>{const it=r.it;if(it.who!=="others")return"";const e=Object.entries(it.alloc||{}).map(([n,v])=>[n,shr(it,v,r.p.i)]),m=r2(r.p.amt-e.reduce((q,x)=>q+x[1],0));return`<div class="nt">For ${e.map(([n,v])=>esc(n)+" "+fmt(v)).join(", ")}${m>0.004?" · Me "+fmt(m):""}</div>`};
function slip(name,list,title){const rows=[];let tot=0,set=0;
 list.forEach(a=>asum(a).rows.forEach(r=>{const v=r.it.who==="others"&&r.it.alloc&&r.it.alloc[name];if(!(v>0))return;const x=shr(r.it,v,r.p.i);tot+=x;if(r.p.paid)set+=x;rows.push({a,r,x})}));
 rows.sort((p,q)=>p.r.p.date>q.r.p.date?1:-1);tot=r2(tot);set=r2(set);
 return`<div class="slip" data-n="${esc(name)}"><h3>Receipt</h3><div class="c">${esc(title)}</div><div class="nm">${esc(name)}</div><hr>${rows.map(({a,r,x})=>`<div class="ln${r.p.paid?" paid":""}"><span>${pd(r.p.date)} · ${esc(r.it.desc)}${r.it.rec?" ("+fname(r.it)+")":r.it.months>1?" "+(r.p.i+1)+"/"+r.it.months:""}</span><span>${fmt(x)}</span></div>${list.length>1?`<div class="ln sub"><span>${esc(a.name)}</span></div>`:""}${r.p.paid&&r.p.on?`<div class="ln sub"><span>Settled ${pd(r.p.on)}</span></div>`:""}`).join("")||`<div class="c">Nothing allocated</div>`}<hr><div class="ln"><span>TOTAL</span><span>PHP ${fmt(tot)}</span></div><div class="ln"><span>SETTLED</span><span>PHP ${fmt(set)}</span></div><div class="ln tot"><span>BALANCE</span><span>PHP ${fmt(r2(tot-set))}</span></div><div class="c" style="font-size:11px;margin-top:6px">Struck-through lines are already settled</div><hr><div class="c">Thank you!</div></div>`}
function rcpt(list,title){const names=[...new Set(list.flatMap(a=>a.items.flatMap(i=>i.who==="others"?Object.keys(i.alloc||{}):[])))];if(!names.length)return"";
 return`<section><h2><svg class="ic sm"><use href="#coin"/></svg> Receipts per person</h2><div class="row" style="margin-bottom:12px"><button onclick="dlSlip(0,1)">Download all as images</button><button class="ghost" onclick="print()">Print / save as PDF</button></div><div id="slips" class="sg">${names.map((n,k)=>`<div class="sw">${slip(n,list,title)}<div class="noprint" style="margin-top:8px"><button class="ghost" onclick="dlSlip(${k})">Download ${esc(n)}'s receipt</button></div></div>`).join("")}</div></section>`}
async function dlSlip(k,all){const nd=[...document.querySelectorAll("#slips .slip")],L=all?nd:[nd[k]];if(!L[0])return toast("Nothing to download.");if(!window.html2canvas)return toast("The image tool did not load. Use Print / save as PDF instead.");
 for(const n of L){const cv=await html2canvas(n,{backgroundColor:"#ffffff",scale:2}),a=document.createElement("a");a.download="receipt-"+n.dataset.n.replace(/[^\w]+/g,"-")+".png";a.href=cv.toDataURL("image/png");a.click()}}
function ledger(a){const g={};asum(a).rows.forEach(r=>(g[r.p.date]=g[r.p.date]||[]).push(r));const ds=Object.keys(g).sort(),t=today();
 if(!ds.length)return`<p class="empty">No items yet.</p>`;
 return`<div class="wrap"><table>`+ds.map(d=>{const un=g[d].filter(r=>!r.p.paid),tt=r2(un.reduce((s,r)=>s+r.p.amt,0));
  return`<tr class="gh"><td colspan="5">${pd(d)}${un.length&&d<t?" · overdue":""} · ${un.length?"PHP "+fmt(tt)+" "+T[sd(a)].due:"all settled"}</td></tr>`+g[d].map(r=>`<tr class="${r.p.paid?"paid":""}"><td><input type="checkbox" ${r.p.paid?"checked":""} onchange="tog('${r.it.id}',${r.p.i})" aria-label="Settled"></td><td>${esc(r.it.desc)}${r.it.note?`<div class="nt">${esc(r.it.note)}</div>`:""}${fl(r)}</td><td class="small">${lbl(r.it,r.p)}</td><td>${r.p.paid?`<input type="date" class="dt" value="${esc(r.p.on)}" onchange="setOn('${r.it.id}',${r.p.i},this.value)" aria-label="Settlement date">`:""}</td><td class="n">${fmt(r.p.amt)} <button class="ghost" style="padding:2px 8px;font-size:12px" onclick="editSaved('${r.it.id}')">Edit</button> <button class="x" onclick="delI('${r.it.id}')" aria-label="Delete item">✕</button></td></tr>`).join("")}).join("")+`</table></div>`}
function it_(iid){const a=accts.find(x=>x.id===cur),it=a.items.find(x=>x.id===iid);it.paidOn=it.paidOn||[];return it}
function tog(iid,i){const it=it_(iid);it.paid[i]=!it.paid[i];if(it.paid[i])it.paidOn[i]=today();else delete it.paidOn[i];save();const y=scrollY;openA(cur);scrollTo(0,y)}
function setOn(iid,i,v){it_(iid).paidOn[i]=v;save();const y=scrollY;openA(cur);scrollTo(0,y)}
function delI(iid){const a=accts.find(x=>x.id===cur),it=a.items.find(x=>x.id===iid);if(!confirm("Delete \""+it.desc+"\" and all its payments?"))return;a.items=a.items.filter(x=>x.id!==iid);save();openA(cur)}
function closeM(){$("#mdl").classList.remove("on")}
function dlj(o,n){const b=new Blob([JSON.stringify(o,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast("Downloaded "+n+". Keep it somewhere safe.")}
function exportAll(){if(!accts.length)return toast("Nothing to download yet.");dlj({app:"financial-buddy",version:2,accounts:accts,people:plist()},"FinancialBuddy-"+today().replace(/-/g,"")+".json")}
const okd=s=>/^\d{4}-\d{2}-\d{2}$/.test(s);
function normA(a){if(!a||typeof a.id!=="string"||!/^[\w-]{4,40}$/.test(a.id)||!a.name||!Array.isArray(a.items))throw 0;
 return{id:a.id,name:String(a.name),kind:String(a.kind||"Other"),side:a.side==="inc"?"inc":"exp",items:a.items.map(it=>{const rec=!!it.rec,m=rec?1:Math.round(+it.months),am=+it.amount;if(!(am>0)||!(m>=1&&m<=600)||!okd(String(it.due))||!/^[\w-]+$/.test(String(it.id)))throw 0;
  const al={};if(it.alloc&&typeof it.alloc==="object")for(const k in it.alloc){const v=r2(+it.alloc[k]);if(v>0)al[String(k).slice(0,60)]=v}
  const pa=it.paid||[],po=it.paidOn||[],LL=rec?Math.min(2000,pa.length):m,paid=Array.from({length:LL},(_,i)=>!!pa[i]),on=Array.from({length:LL},(_,i)=>paid[i]&&okd(String(po[i]))?String(po[i]):"");
  return{id:String(it.id),desc:String(it.desc||""),amount:am,months:m,due:String(it.due),note:String(it.note||""),paid,paidOn:on,who:Object.keys(al).length?"others":"me",alloc:al,rec,freq:FQ[it.freq]?it.freq:"m",until:okd(String(it.until))?String(it.until):""}})}}
let pendA=null,pendP=[];
function mergeA(c,n){const m=new Map(c.items.map(i=>[i.id,i]));n.items.forEach(i=>{const x=m.get(i.id);if(!x){c.items.push(i);return}
 x.paidOn=x.paidOn||[];for(let k=0,K=x.rec?Math.max(x.paid.length,i.paid.length):x.months;k<K;k++)if(!x.paid[k]&&i.paid[k]){x.paid[k]=true;x.paidOn[k]=i.paidOn[k]||""}});return c}
function impDialog(n){$("#mc").innerHTML=`<h2 style="margin-bottom:8px">You already have data here</h2><p>This browser has ${accts.length} account${accts.length===1?"":"s"} saved. The file has ${n}. What should happen?</p><p class="small"><b>Overwrite</b> replaces everything in this browser with the file.<br><b>Merge</b> keeps what you have and adds the accounts and items from the file that are missing. A payment counts as settled if it is settled in either one.<br><b>Cancel</b> changes nothing.</p><div class="row"><button onclick="applyImp('overwrite')">Overwrite</button><button class="ghost" onclick="applyImp('merge')">Merge</button><button class="ghost" onclick="applyImp('cancel')">Cancel</button></div>`;$("#mdl").classList.add("on")}
function applyImp(mode){const L=pendA;pendA=null;closeM();if(mode==="cancel"||!L)return toast("Nothing was changed.");
 if(mode==="overwrite"){accts=L;people=[...new Set(pendP)]}else{people=[...new Set([...people,...pendP])]}savePpl();if(mode==="overwrite")0;else L.forEach(a=>{const c=accts.find(x=>x.id===a.id);if(c)mergeA(c,a);else accts.push(a)});
 save();cur=null;home();toast("Data "+(mode==="merge"?"merged":"loaded"))}
function importFile(inp){const f=inp.files[0];inp.value="";if(!f)return;const rd=new FileReader();rd.onerror=()=>toast("Could not read that file.");
 rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.app&&d.app!=="financial-buddy")throw 0;if(!Array.isArray(d.accounts)||!d.accounts.length)throw 0;pendA=d.accounts.map(normA);pendP=Array.isArray(d.people)?d.people.map(x=>String(x).slice(0,60)).filter(Boolean).slice(0,200):[];
  if(accts.length)impDialog(pendA.length);else applyImp("overwrite")}catch(e){toast("That doesn't look like a Financial Buddy file.")}};rd.readAsText(f)}
home();
</script>
