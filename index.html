<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f3ea;--card:#fffcf6;--sand:#e9dfcb;--lilac:#e8ddff;--orchid:#c4aaf5;--violet:#7a4fd8;--deep:#3a2373;--pink:#e3d4ff;--ink:#2d2640;--mute:#7b7288;--ok:#5a34c4;--bad:#c62828}
*{box-sizing:border-box}body{margin:0;background:#f8f3ea;color:var(--ink);font:15px/1.5 "Courier Prime",ui-monospace,monospace}
h1,h2,h3{font-family:"Special Elite","Courier Prime",monospace;font-weight:400;margin:0;color:var(--deep)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:#fffcf6;color:var(--ink);border-bottom:1px solid var(--sand)}
header h1{color:var(--deep);font-size:22px;cursor:pointer;display:flex;align-items:center;gap:8px}
#auth{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap;justify-content:flex-end}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
section{background:var(--card);border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 2px 12px #8a6d3b1a}
section>h2{font-size:21px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input,select,button,textarea{font:inherit}
input,select,textarea{width:100%;padding:9px 11px;border:1.5px solid var(--sand);border-radius:10px;background:#fffdf8;color:var(--ink)}
input[type=checkbox]{width:auto;accent-color:var(--violet)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
button{background:var(--violet);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700}
button:hover{background:#6a49c4}button.ghost{background:var(--lilac);color:var(--deep)}button.ghost:hover{background:var(--orchid)}
button.x{background:none;color:var(--bad);padding:2px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:6px;background:var(--lilac);border-radius:99px;padding:5px 12px;font-size:14px;color:var(--deep);cursor:pointer;margin:0}
.chip.sm{padding:3px 9px;font-size:12px}
.ck{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px;color:var(--ink);margin:0;cursor:pointer}
.tag{background:var(--pink);color:var(--deep);border-radius:99px;padding:3px 10px;font-size:12px}
.code{background:var(--lilac);border-radius:6px;padding:1px 7px;font-size:13px;color:var(--deep)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--sand);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:700}td.n,th.n{text-align:right;white-space:nowrap}
.neg{color:var(--bad);font-weight:700}.empty{color:var(--mute);padding:8px 0}.small{font-size:12px;color:var(--mute)}
.wrap{overflow-x:auto}.blk{margin-top:14px}
.crow{display:flex;gap:10px;align-items:center;margin-bottom:6px}.crow>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.crow input{width:130px;flex:none}
.item{border:1.5px dashed var(--orchid);border-radius:12px;padding:10px;margin-bottom:10px}.g2i{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
details{border:1.5px solid var(--sand);border-radius:12px;padding:8px 12px;margin-bottom:10px;background:#fffdf8}summary{cursor:pointer;font-weight:700;color:var(--deep)}
details details{margin:8px 0 0;background:#fff}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:12px;display:none;max-width:90%;z-index:50}
.mdl{position:fixed;inset:0;background:#2d264088;display:none;place-items:center;z-index:40}.mdl.on{display:grid}
.mc{background:var(--card);border-radius:18px;max-width:540px;width:calc(100% - 24px);max-height:88vh;overflow:auto;padding:18px}
#slips{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;align-items:flex-start}
.slip{background:#fff;width:330px;max-width:100%;padding:18px 16px;font:13px/1.45 "Courier Prime",monospace;color:#222;border:1px dashed var(--orchid);border-radius:4px}
.slip h3{font-family:"Special Elite","Courier Prime",monospace;font-size:16px;text-align:center;color:#222}
.slip .c{text-align:center;color:#777}.slip hr{border:0;border-top:1px dashed #bbb;margin:9px 0}
.slip .ln{display:flex;justify-content:space-between;gap:10px;white-space:nowrap;overflow:hidden}
.slip .nm{text-align:center;font-weight:700;font-size:15px;margin-top:4px}.slip .tot{font-weight:700}
@media print{body *{visibility:hidden}#slips,#slips *{visibility:visible}#slips{position:absolute;left:0;top:0;width:100%;display:block}.slip{border:0;margin:0 auto 20px;page-break-after:always;break-inside:avoid}.mdl{display:none!important}}
.ic{width:1em;height:1em;flex:none}header h1 .ic{width:26px;height:26px;color:var(--violet);transform:rotate(45deg)}
.hero{background:#fffcf6;border-radius:18px;padding:20px 20px 6px;margin-bottom:18px;box-shadow:0 2px 12px #8a6d3b1a}
.hero h2{font-size:27px}.hero p{margin:4px 0 0;color:var(--mute)}.hero svg{width:100%;height:auto;display:block;margin-top:6px}
.stamp{width:56px;height:56px;border-radius:50%;border:2.5px double var(--violet);color:var(--violet);display:grid;place-items:center;font:400 18px "Special Elite",monospace;transform:rotate(-9deg);flex:none;background:#f3ecff}
.plane-sm{width:18px;height:18px;vertical-align:-3px;color:var(--violet);transform:rotate(45deg);display:inline-block}
.grid.g4{grid-template-columns:1.3fr 1.2fr .8fr .9fr;gap:clamp(6px,1.8vw,10px)}.g4>*{min-width:0}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g4.g3{grid-template-columns:1.5fr 1.3fr .9fr}
.grid.g4.ex{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:dense}
@media(max-width:640px){.g4 input,.g4 select{font-size:12px;padding:9px 6px;border-radius:9px}.g4 label{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lx{display:none}.g4 input[type=date]{padding-left:3px;padding-right:1px;font-size:10.5px}.crow input{width:104px}}
@media(max-width:380px){.g4 input,.g4 select{font-size:11px;padding:8px 4px}.g4 label{font-size:9.5px}}
.plus{background:none;color:var(--violet);border:1.5px dashed var(--orchid);padding:3px 12px;font-weight:400;font-size:13px}.plus:hover{background:var(--lilac)}
a.btn{display:inline-block;text-decoration:none;background:var(--lilac);color:var(--deep);border-radius:10px;padding:9px 16px;font-weight:700;font-size:15px}a.btn:hover{background:var(--orchid)}
.ok{color:var(--ok);font-weight:700}
#exl tr[onclick]{cursor:pointer}#exl tr[onclick]:hover td{background:#faf5ff}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}.dl dt{color:var(--mute)}.dl dd{margin:0;text-align:right;overflow-wrap:anywhere}
.pend{color:var(--bad);font-size:11px;font-weight:700;white-space:normal;display:inline-block;max-width:120px;line-height:1.25}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="plane" viewBox="0 0 24 24"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></symbol>
<symbol id="bag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2.5"/><path d="M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2M9 11v5M15 11v5"/></g></symbol>
</defs></svg>
<header><h1 onclick="home()"><svg class="ic"><use href="#plane"/></svg>Travel Buddy</h1><div id="auth"></div></header>
<main id="app"></main><input type="file" id="fi" accept=".json,application/json" hidden onchange="importFile(this)">
<div class="mdl" id="mdl" onclick="if(event.target===this)closeM()"><div class="mc" id="mc"></div></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const COUNTRIES=[["JP","Japan","JPY"],["KR","South Korea","KRW"],["SG","Singapore","SGD"],["TH","Thailand","THB"],["VN","Vietnam","VND"],["HK","Hong Kong","HKD"],["TW","Taiwan","TWD"],["CN","China","CNY"],["MY","Malaysia","MYR"],["ID","Indonesia","IDR"],["US","United States","USD"],["CA","Canada","CAD"],["AU","Australia","AUD"],["NZ","New Zealand","NZD"],["GB","United Kingdom","GBP"],["FR","France","EUR"],["IT","Italy","EUR"],["ES","Spain","EUR"],["DE","Germany","EUR"],["CH","Switzerland","CHF"],["AE","UAE","AED"],["PH","Philippines","PHP"]];
const MODES=["Cash","Credit card","Debit card","GCash","Bank transfer","Other"];
const BOOKS=["Agoda","Klook","Booking.com","Airbnb","Trip.com","Traveloka","Expedia","KKday","Direct / walk-in"];
const HERO=`<div class="hero"><h2>Where to next?</h2><p>Split trip costs in any currency and settle up in pesos.</p>
<svg viewBox="0 0 640 120" aria-hidden="true"><ellipse cx="130" cy="30" rx="34" ry="10" fill="#f1e8d6"/><ellipse cx="156" cy="24" rx="22" ry="9" fill="#f1e8d6"/><ellipse cx="400" cy="100" rx="40" ry="10" fill="#f1e8d6"/><ellipse cx="428" cy="94" rx="24" ry="9" fill="#f1e8d6"/>
<path d="M44 98 C170 8 300 128 470 52 S585 28 598 24" fill="none" stroke="#7a4fd8" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/>
<circle cx="300" cy="78" r="5" fill="#e9a23b"/><circle cx="470" cy="52" r="5" fill="#e9a23b"/>
<use href="#bag" x="8" y="78" width="38" height="38" style="color:#7a4fd8"/>
<use href="#plane" x="580" y="4" width="40" height="40" transform="rotate(62 600 24)" style="color:#7a4fd8"/></svg></div>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const rt=n=>Number(n).toLocaleString("en-US",{maximumFractionDigits:6});
const r2=n=>(Math.round(n*100)/100).toFixed(2);
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const ph=e=>e.php>0?e.php:(e.rate>0?e.amount*e.rate:0);
const isPend=e=>e.cur!=="PHP"&&!(ph(e)>0);
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const neg=n=>n<-.005?`<span class="neg">(${fmt(-n)})</span>`:fmt(Math.abs(n)<.005?0:n);
const byCode=(a,b)=>a.code>b.code?1:-1;
let mdlMode=null,trip=null,shellId=null,editId=null,showRc=false,last="rate",editCur=null,items=[],custVals={},payVals={},amtAuto=true,sugg=[];
const exclWho=new Set(),exclEx=new Set(),exclPer=Object.create(null);
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",4000)}

/* ---------- storage / files ---------- */
function save(t){try{localStorage.setItem("ps:"+t.id,JSON.stringify(t))}catch(e){toast("Could not save in this browser. Download your trip file now.")}}
const allTrips=()=>Object.keys(localStorage).filter(k=>k.startsWith("ps:")).map(k=>{try{return JSON.parse(localStorage[k])}catch{return null}}).filter(Boolean);
const FB_URL="https://introvertdiary.github.io/travelbuddy/Financial%20Buddy.html";
function topbar(){$("#auth").innerHTML=`<a class="btn" href="${FB_URL}" target="_blank" rel="noopener noreferrer">Financial Buddy</a><button class="ghost" onclick="$('#fi').click()">Open saved file</button>`}
const dTxt=t=>t.start&&t.end?new Date(t.start+"T00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" – "+new Date(t.end+"T00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";
function tripCode(t){if(!t.start||!t.end)return t.cc+"-"+(String(t.name).replace(/[^\w]+/g,"-").replace(/^-|-$/g,"")||"trip");const a=t.start.split("-"),b=t.end.split("-");return String(t.cc).replace(/[^\w]/g,"")+a[1]+a[2]+"-"+(a[1]===b[1]?b[2]:b[1]+b[2])}
function defDate(){let d=today();if(trip&&trip.start&&d<trip.start)d=trip.start;if(trip&&trip.end&&d>trip.end)d=trip.end;return d}
function dl(obj,name){const b=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast("Downloaded "+name+". Keep it somewhere safe.")}
function exportTrip(t=trip){dl({app:"travel-buddy",version:2,trip:t},tripCode(t)+".json")}
function exportById(id){const t=JSON.parse(localStorage.getItem("ps:"+id)||"null");if(t)exportTrip(t)}
function exportAll(){const L=allTrips();if(!L.length)return toast("No trips to download yet.");dl({app:"travel-buddy",version:2,trips:L},"TravelBuddy-all-trips-"+today().replace(/-/g,"")+".json")}
function delTrip(id){if(!confirm("Delete this trip from this browser? Download it first if you want a copy."))return;localStorage.removeItem("ps:"+id);home()}
function norm(t){
 if(!t||typeof t.id!=="string"||!/^[\w-]{4,40}$/.test(t.id)||!t.name||!t.cc||!t.cur||!Array.isArray(t.people)||!t.people.length||!Array.isArray(t.expenses))throw 0;
 t.people=t.people.map(String);
 t.payments=(Array.isArray(t.payments)?t.payments:[]).map(x=>({id:String(x.id||uid()).replace(/[^\w-]/g,"")||uid(),from:String(x.from),to:String(x.to),amount:Number(x.amount),date:String(x.date||""),...(x.eid?{eid:String(x.eid).replace(/[^\w-]/g,"")}:{})})).filter(x=>x.amount>0);
 t.expenses.forEach(e=>{e.amount=Number(e.amount);e.rate=e.rate==null?null:Number(e.rate);e.php=e.php==null?null:Number(e.php);
  if(!(e.amount>0)||(e.rate!=null&&!(e.rate>0))||(e.php!=null&&!(e.php>0))||!Array.isArray(e.share)||!/^[\w-]+$/.test(String(e.id)))throw 0;
  e.id=String(e.id);e.share=e.share.map(String);e.payer=String(e.payer||t.people[0]);
  if(e.items)e.items=e.items.map(i=>({name:String(i.name||""),orig:String(i.orig||""),amount:Number(i.amount)||0,owners:Array.isArray(i.owners)?i.owners.map(String):[]}));
  if(e.alloc)for(const k in e.alloc)e.alloc[k]=Number(e.alloc[k])||0;
  if(e.allocLocal)for(const k in e.allocLocal)e.allocLocal[k]=Number(e.allocLocal[k])||0;
  if(e.payersLocal)for(const k in e.payersLocal)e.payersLocal[k]=Number(e.payersLocal[k])||0;
  if(e.payers)for(const k in e.payers)e.payers[k]=Number(e.payers[k])||0});
 return t}
function importFile(inp){const f=inp.files[0];inp.value="";if(!f)return;const rd=new FileReader();
 rd.onerror=()=>toast("Could not read that file.");
 rd.onload=()=>{try{const d=JSON.parse(rd.result),raw=Array.isArray(d.trips)?d.trips:[d.trip||d],list=raw.map(norm);if(!list.length)throw 0;
  const ex=list.filter(t=>localStorage.getItem("ps:"+t.id));let rep=true;
  if(ex.length)rep=confirm(list.length===1?"This trip is already saved in this browser. Replace it with the version in the file?":ex.length+" of "+list.length+" trips in this file are already saved in this browser. Replace them with the versions in the file? (Cancel keeps your current copies and adds only the new ones.)");
  let n=0;list.forEach(t=>{if(localStorage.getItem("ps:"+t.id)&&!rep)return;save(t);n++});
  if(list.length===1&&n===1)openTrip(list[0].id);else home();
  toast(n+" trip"+(n===1?"":"s")+" loaded")}catch(e){toast("That doesn't look like a Travel Buddy file.")}};
 rd.readAsText(f)}

/* ---------- calculations ---------- */
function shares(e){const tot=ph(e),o=Object.create(null);
 if(e.items&&e.items.length){const sum=e.items.reduce((s,i)=>s+i.amount,0)||1;e.items.forEach(i=>{const ow=i.owners.length?i.owners:e.share;ow.forEach(n=>o[n]=(o[n]||0)+i.amount/sum*tot/ow.length)});return o}
 if(e.alloc){for(const n in e.alloc)o[n]=e.alloc[n];return o}
 if(e.allocLocal){const sm=Object.values(e.allocLocal).reduce((a,b)=>a+b,0)||1;for(const n in e.allocLocal)o[n]=e.allocLocal[n]/sm*tot;return o}
 e.share.forEach(n=>o[n]=tot/e.share.length);return o}
function payersOf(e){const o=Object.create(null);
 if(e.payers&&Object.keys(e.payers).length){for(const n in e.payers)o[n]=e.payers[n]}
 else if(e.payersLocal&&Object.keys(e.payersLocal).length){const sm=Object.values(e.payersLocal).reduce((a,b)=>a+b,0)||1,tot=ph(e);for(const n in e.payersLocal)o[n]=e.payersLocal[n]/sm*tot}
 else o[e.payer]=ph(e);return o}
function calc(list){const p=Object.create(null);trip.people.forEach(n=>p[n]={recv:0,share:0,front:0,cover:0,sp:0,sr:0,paid:0,out:0});
 list.forEach(e=>{const pm=payersOf(e),sh=shares(e);for(const n in pm)if(p[n]){p[n].front+=pm[n];p[n].cover+=Math.min(pm[n],sh[n]||0)}for(const n in sh)if(p[n])p[n].share+=sh[n]});
 (trip.payments||[]).forEach(x=>{if(p[x.from])p[x.from].sp+=x.amount;if(p[x.to])p[x.to].sr+=x.amount});
 for(const n in p){const q=p[n];q.paid=q.sp;q.recv=Math.max(q.front-q.sr,0);q.out=q.share-q.sp}return p}
function settle(c){const d=[],cr=[];for(const n in c){const v=c[n].out;if(v>.005)d.push([n,v]);else if(v<-.005)cr.push([n,-v])}
 const r=[];let i=0,j=0;while(i<d.length&&j<cr.length){const m=Math.min(d[i][1],cr[j][1]);r.push([d[i][0],cr[j][0],m]);d[i][1]-=m;cr[j][1]-=m;if(d[i][1]<.005)i++;if(cr[j][1]<.005)j++}return r}
function nextCode(){const re=new RegExp("^"+trip.cc+"(\\d+)$");const m=Math.max(0,...trip.expenses.map(e=>(re.exec(e.code)||[0,0])[1]*1));return trip.cc+String(m+1).padStart(3,"0")}

/* ---------- home ---------- */
function home(){
 trip=null;shellId=null;topbar();
 const list=allTrips().sort((a,b)=>b.created-a.created);
 const form=`<section><h2>Start a trip</h2><div class="grid g4 g3">
  <div><label>Trip name</label><input id="tn" placeholder="Trip name"></div>
  <div><label>Country</label><select id="tc" onchange="pickC()">${COUNTRIES.map(c=>`<option value="${c[0]}|${c[1]}|${c[2]}">${c[1]} (${c[0]})</option>`).join("")}</select></div>
  <div><label>Currency</label><input id="tcur" maxlength="3" value="JPY"></div>
  </div>
  <div class="grid g2" style="margin-top:10px"><div><label>Travel start</label><input id="ts" type="date"></div><div><label>Travel end</label><input id="te" type="date"></div></div>
  <div style="margin-top:10px"><label class="ck" style="margin-bottom:6px"><input type="checkbox" id="solo" onchange="soloChange()">Solo trip (just me, no splitting)</label><label id="tpl">Participants, separated by commas (include yourself)</label><input id="tp" placeholder="Names, separated by commas"></div>
  <div style="margin-top:12px"><button onclick="createTrip()">Create trip</button></div></section>`;
 $("#app").innerHTML=HERO+form+`<section><h2><svg class="plane-sm"><use href="#plane"/></svg> Your trips</h2>
  <div class="row" style="margin-bottom:8px"><button class="ghost" onclick="exportAll()">Download all trips (one file)</button><span class="small">Open it later with "Open saved file". It restores every trip at once.</span></div>
  ${list.length?list.map(t=>`<div class="row sp" style="padding:8px 0;border-bottom:1px solid var(--sand)"><div><b>${esc(t.name)}</b> <span class="tag">${esc(t.country)} · ${esc(t.cur)}${t.solo?" · solo":""}</span><div class="small">${dTxt(t)?esc(dTxt(t))+" · ":""}${t.people.map(esc).join(", ")}</div></div><div class="row"><button class="ghost" onclick="openTrip('${t.id}')">Open</button><button class="ghost" onclick="exportById('${t.id}')">Download</button><button class="x" onclick="delTrip('${t.id}')">Delete</button></div></div>`).join(""):`<p class="empty">No trips yet. Start one above, or open a saved file.</p>`}
  <p class="small" style="margin:12px 0 0">Trips are saved in this browser only. Download a file to back it up or continue on another device.</p></section>
  <section><h2>Financial Buddy</h2><p style="margin:0 0 10px">Your Financial Buddy site. It opens in a new tab.</p><a class="btn" href="${FB_URL}" target="_blank" rel="noopener noreferrer">Open Financial Buddy</a></section>`;
}
function pickC(){const [,,cur]=$("#tc").value.split("|");$("#tcur").value=cur}
function soloChange(){const s=$("#solo").checked;$("#tpl").textContent=s?"Your name":"Participants, separated by commas (include yourself)";$("#tp").placeholder=s?"Your name":"Names, separated by commas"}

function showF(k,focus=true){$("#"+k+"w").style.display="";$("#"+k+"b").style.display="none";if(focus)$("#"+(k==="lk"?"link":"note")).focus()}

function onPhp(){last="php";const a=parseFloat($("#amt").value),p=parseFloat($("#php").value);$("#rate").value=a>0&&p>0?+(p/a).toFixed(6):"";refreshSplit()}

function custInfo(){const a=parseFloat($("#amt").value)||0;if($("#kind").value==="php")return{local:false,total:a,label:"PHP",can:false};
 const p=parseFloat($("#php").value),has=p>0,local=!has||custUnit==="local";return{local,total:local?a:p,label:local?curNow():"PHP",can:has}}

function rateHint(){const el=$("#rh");if(!el)return;const a=parseFloat($("#amt").value);el.style.display=$("#kind").value==="foreign"&&a>0&&!(parseFloat($("#rate").value)>0)&&!(parseFloat($("#php").value)>0)?"":"none"}
function refreshSplit(){rateHint();if(trip.solo)return;const u=unitInfo(),c=custInfo();
 if(prevU&&prevU.pend!==u.pend&&prevU.total>0&&u.total>0){const f=u.total/prevU.total;for(const k in payVals){const x=parseFloat(payVals[k]);if(x>0)payVals[k]=r2(x*f)}if($("#mpt").checked)renderMp()}
 if(prevC&&prevC.local!==c.local&&prevC.total>0&&c.total>0){const f=c.total/prevC.total;for(const k in custVals){const x=parseFloat(custVals[k]);if(x>0)custVals[k]=r2(x*f)}}
 const redo=prevC&&(prevC.local!==c.local||prevC.can!==c.can);

 if($("#smode").value==="custom"){if(redo||!Object.keys(custVals).length)renderCust();else custSum()}if($("#mpt").checked)payInfo()}

/* ----- who shares / split ----- */
const shChecked=()=>[...document.querySelectorAll(".sh:checked")].map(x=>x.value);
function shAll(){const c=$("#shall").checked;document.querySelectorAll(".sh").forEach(x=>x.checked=c);if($("#smode").value==="custom")renderCust()}
function shChange(){$("#shall").checked=[...document.querySelectorAll(".sh")].every(x=>x.checked);if($("#smode").value==="custom")renderCust()}
function splitChange(){const m=$("#smode").value;$("#shc").style.display=m==="items"?"none":"";$("#cust").style.display=m==="custom"?"":"none";$("#itm").style.display=m==="items"?"":"none";
 if(m==="custom")renderCust();if(m==="items"){if(!items.length)items.push({name:"",orig:"",amount:0,owners:[]});renderItems()}}
function renderCust(){const sel=shChecked(),U=custInfo(),tot=U.total,k=sel.length,us=$("#kind").value==="foreign"?`<div class="row" style="margin-bottom:8px"><label style="margin:0">Amounts in</label><select id="cu" onchange="setCustUnit(this.value)" style="width:auto"><option value="local"${U.local?" selected":""}>${esc(curNow())} (foreign)</option><option value="php"${U.local?"":" selected"}${U.can?"":" disabled"}>PHP (converted)</option></select></div>`:"";
 $("#cust").innerHTML=us+(k?sel.map((n,i)=>{const v=custVals[n]!=null?custVals[n]:(tot&&k?(i<k-1?r2(tot/k):r2(tot-Math.round(tot/k*100)/100*(k-1))):"");return`<div class="crow"><span>${esc(n)}</span><input type="number" step="any" inputmode="decimal" class="cv" data-n="${esc(n)}" value="${esc(v)}" placeholder="${esc(U.label)}" oninput="custVals[this.dataset.n]=this.value;custSum()"></div>`}).join("")+`<div class="small" id="cs"></div><div class="row" style="margin-top:6px"><button class="ghost" onclick="custVals={};renderCust()">Split equally</button></div>`:`<p class="small">Tick who shares first.</p>`);custSum()}
function custSum(){let s=0;document.querySelectorAll(".cv").forEach(i=>{const x=parseFloat(i.value);if(x>0)s+=x});const u=custInfo(),t=u.total,el=$("#cs");if(el)el.innerHTML=`Charged in ${u.label}: ${fmt(s)} of ${fmt(t)}`+(Math.abs(s-t)>.05&&t>0?` <span class="neg">(${fmt(t-s)} left)</span>`:"")}

/* ----- receipt items ----- */
function renderItems(){const P=trip.people;
 $("#itl").innerHTML=items.map((it,i)=>`<div class="item"><div class="g2i"><input value="${esc(it.name)}" placeholder="Item (English)" oninput="items[${i}].name=this.value"><input value="${esc(it.orig||"")}" placeholder="Original text (optional)" oninput="items[${i}].orig=this.value"></div>
  <div class="g2i"><input type="number" step="any" inputmode="decimal" value="${it.amount||""}" placeholder="Amount" oninput="itemAmt(${i},this.value)"><div><button class="x" onclick="items.splice(${i},1);renderItems()">Remove</button></div></div>
  <div class="chips">${P.map(p=>`<label class="chip sm"><input type="checkbox" ${it.owners.includes(p)?"checked":""} data-p="${esc(p)}" onchange="ownerTog(${i},this.dataset.p,this.checked)">${esc(p)}</label>`).join("")}</div></div>`).join("")+`<div class="small" id="its"></div>`;itemsChanged()}
function itemAmt(i,v){items[i].amount=parseFloat(v)||0;itemsChanged()}
function ownerTog(i,p,c){const o=items[i].owners;const k=o.indexOf(p);if(c&&k<0)o.push(p);if(!c&&k>=0)o.splice(k,1)}
function itemsChanged(){const s=items.reduce((a,i)=>a+(i.amount||0),0),el=$("#its");if(el)el.textContent="Items total: "+fmt(s)+" "+($("#kind").value==="php"?"PHP":curNow());if(amtAuto&&s>0){$("#amt").value=+s.toFixed(2);onAmt()}}
function pasteItems(){const lines=$("#paste").value.split(/\n/).map(s=>s.trim()).filter(Boolean);if(items.length===1&&!items[0].name&&!items[0].amount)items=[];let n=0;
 lines.forEach(l=>{const p=l.split(/\s*[|\t]\s*/);if(p.length<2)return;const amt=parseFloat(p[p.length-1].replace(/[^\d.\-]/g,""));if(!(amt>0))return;let name,orig="";if(p.length>=3){orig=p[0];name=p[1]}else name=p[0];items.push({name,orig,amount:amt,owners:[]});n++});
 if(!n){if(!items.length)items.push({name:"",orig:"",amount:0,owners:[]});renderItems();return toast("No items found. Use: Item | Price")}$("#paste").value="";renderItems()}

/* ----- save / edit / delete ----- */
function addExp(){
 const v=id=>$("#"+id).value,solo=!!trip.solo,isP=v("kind")==="php",cur=isP?"PHP":curNow(),amount=parseFloat(v("amt")),P=trip.people;let rate=1,pv=amount,pend=false;
 if(!v("desc").trim()||!(amount>0))return toast("Add a description and an amount.");
 if(!isP){const p0=parseFloat(v("php")),x0=parseFloat(v("rate"));if(last==="php"&&p0>0){pv=p0;rate=p0/amount}else if(x0>0){rate=x0;pv=Math.round(amount*x0*100)/100}else{rate=null;pv=null;pend=true}}
 let payer=solo?P[0]:v("payer"),payers=null,payersL=null,share=solo?[P[0]]:shChecked(),alloc=null,allocL=null,itm=null;
 if(!solo&&$("#mpt").checked){const m={};let s=0;document.querySelectorAll(".pv").forEach(i=>{const x=parseFloat(i.value);if(x>0){m[i.dataset.n]=x;s+=x}});
  if(!Object.keys(m).length)return toast("Enter how much each payer paid.");if(Math.abs(s-(pend?amount:pv))>.05)return toast("The payers' amounts add up to "+fmt(s)+" but the expense is "+(pend?cur:"PHP")+" "+fmt(pend?amount:pv)+".");if(pend)payersL=m;else payers=m;payer=Object.keys(m)[0]}
 const mode=solo?"equal":v("smode");
 if(mode==="items"){if(!items.length)return toast("Add at least one item.");for(const i of items){if(!i.name.trim()||!(i.amount>0))return toast("Each item needs a name and an amount.");if(!i.owners.length)return toast("Tick who owns \""+i.name+"\".")}
  itm=items.map(i=>({name:i.name.trim(),orig:(i.orig||"").trim(),amount:i.amount,owners:[...i.owners]}));share=[...new Set(itm.flatMap(i=>i.owners))]}
 else if(mode==="custom"){if(!share.length)return toast("Tick who shares this expense.");alloc={};let s=0;document.querySelectorAll(".cv").forEach(i=>{const x=parseFloat(i.value);if(x>0){alloc[i.dataset.n]=x;s+=x}});
  const ci=custInfo();if(Math.abs(s-ci.total)>.05)return toast("The custom amounts add up to "+fmt(s)+" but the expense is "+ci.label+" "+fmt(ci.total)+".");if(ci.local){allocL=alloc;alloc=null}share=Object.keys(allocL||alloc)}
 else if(!share.length)return toast("Tick who shares this expense (use All to tick everyone).");
 const e={id:editId||uid(),code:v("code").trim(),date:v("date"),desc:v("desc").trim(),amount,cur,rate,php:pv,mode:v("mode"),book:v("book").trim(),link:v("link").trim(),note:v("note").trim(),payer,share};
 if(payers)e.payers=payers;if(alloc)e.alloc=alloc;if(payersL)e.payersLocal=payersL;if(allocL)e.allocLocal=allocL;if(itm)e.items=itm;
 trip.expenses=editId?trip.expenses.map(x=>x.id===editId?e:x):[...trip.expenses,e];
 save(trip);resetForm();lists();toast("Saved in this browser");
}
function resetForm(){editId=null;if(!$("#desc"))return;
 ["desc","amt","rate","php","book","link","note"].forEach(i=>$("#"+i).value="");
 editCur=null;last="rate";amtAuto=true;prevU=null;prevC=null;custUnit=null;items=[];custVals={};payVals={};hideF();
 $("#kind").value=trip.cur==="PHP"?"php":"foreign";
 if(!trip.solo){$("#mpt").checked=false;mpToggle();$("#smode").value="equal";document.querySelectorAll(".sh").forEach(x=>x.checked=false);$("#shall").checked=false;splitChange()}
 kindChange();$("#code").value=nextCode();$("#ft").textContent="Add expense";$("#sv").textContent="Save expense";$("#cn").style.display="none"}
function editExp(id){const e=trip.expenses.find(x=>x.id===id);if(!e)return;editId=id;prevU=null;prevC=null;
 $("#code").value=e.code;$("#date").value=e.date;$("#desc").value=e.desc;$("#amt").value=e.amount;editCur=e.cur==="PHP"?null:e.cur;last="rate";amtAuto=false;
 $("#kind").value=e.cur==="PHP"?"php":"foreign";$("#rate").value=e.cur==="PHP"?"":(e.rate>0?e.rate:"");$("#php").value=e.cur==="PHP"?"":(ph(e)>0?r2(ph(e)):"");
 $("#book").value=e.book||"";$("#link").value=e.link||"";$("#note").value=e.note||"";hideF();if(e.link)showF("lk",false);if(e.note)showF("nt",false);$("#mode").value=e.mode;items=[];custVals={};payVals={};
 if(!trip.solo){const pp=e.payers||e.payersLocal,mp=!!(pp&&Object.keys(pp).length);$("#mpt").checked=mp;if(mp)for(const n in pp)payVals[n]=pp[n];$("#payer").value=e.payer;mpToggle();
  document.querySelectorAll(".sh").forEach(x=>x.checked=e.share.includes(x.value));$("#shall").checked=[...document.querySelectorAll(".sh")].every(x=>x.checked);
  {const al=e.alloc||e.allocLocal;if(al)for(const n in al)custVals[n]=r2(al[n]);custUnit=e.allocLocal?"local":(e.alloc?"php":null)}if(e.items)items=e.items.map(i=>({...i,owners:[...i.owners]}));

/* ----- payments (settle up) ----- */
function addPay(){const f=$("#pf").value,t=$("#pt").value,a=parseFloat($("#pm").value);
 if(!(a>0))return toast("Enter the amount that was paid.");
 (trip.payments=trip.payments||[]).push({id:uid(),from:f,to:t,amount:Math.round(a*100)/100,date:today()});save(trip);lists();toast("Payment recorded")}
function undoPay(id){trip.payments=(trip.payments||[]).filter(x=>x.id!==id);save(trip);lists()}

/* ---------- per-expense paid status ---------- */
function expStatus(){const out=Object.create(null),debts=[];
 const list=[...trip.expenses].sort((a,b)=>a.date===b.date?byCode(a,b):(a.date>b.date?1:-1));
 list.forEach(e=>{const T=ph(e),sh=shares(e),pm=payersOf(e);out[e.id]={d:0,u:0,items:[]};if(!(T>0))return;
  for(const s in sh){if(!(sh[s]>0))continue;for(const n in pm){if(!(pm[n]>0))continue;const a=sh[s]*pm[n]/T;debts.push({id:e.id,from:s,to:n,amt:a,rem:a});out[e.id].d+=a}}});
 const pair=(f,t)=>debts.filter(x=>x.from===f&&x.to===t);
 const apply=(arr,amt)=>{for(const x of arr){if(amt<=0)break;const u=Math.min(x.rem,amt);x.rem-=u;amt-=u}};
 const pays=trip.payments||[];
 pays.filter(p=>p.eid).forEach(p=>apply(debts.filter(x=>x.id===p.eid&&x.from===p.from&&x.to===p.to),p.amount));
 pays.filter(p=>!p.eid).forEach(p=>apply(pair(p.from,p.to),p.amount));
 debts.forEach(x=>{out[x.id].u+=x.rem;out[x.id].items.push(x)});return out}
const selfDebt=(n,xs=expStatus())=>Object.values(xs).reduce((t,q)=>t+q.items.filter(x=>x.from===n&&x.to===n).reduce((u,x)=>u+x.amt,0),0);
/* ---------- lists ---------- */
function lists(){
 const ex=[...trip.expenses].sort(byCode),solo=!!trip.solo,P=trip.people;
 const payTxt=e=>{const m=payersOf(e),k=Object.keys(m);return k.length>1?k.map(n=>isPend(e)?esc(n):`${esc(n)} <span class="small">${fmt(m[n])}</span>`).join("<br>"):esc(k[0])};
 const shTxt=e=>e.items?"By items: "+e.share.map(esc).join(", "):(e.alloc||e.allocLocal)?"Custom: "+e.share.map(esc).join(", "):(e.share.length===P.length?"Everyone":e.share.map(esc).join(", "));
 const pendN=trip.expenses.filter(isPend).length,pendBan=pendN?`<p class="pend" style="max-width:none;margin:0 0 8px">${pendN} expense${pendN>1?"s have":" has"} no converted rate yet and ${pendN>1?"are":"is"} not included in these numbers.</p>`:"";
 const xs=solo?null:expStatus();
 const stCell=e=>{const q=xs[e.id];return isPend(e)?`<span class="small">–</span>`:q.d<.005?`<span class="small">–</span>`:q.u<.005?`<span class="ok">✓ Paid</span>`:`${fmt(q.u)}<div class="small">${q.u<q.d-.005?"Partial":"Unpaid"}</div>`};
 $("#exl").innerHTML=ex.length?`<div class="wrap"><table><tr><th>Code</th><th>Details</th>${solo?"":"<th>Paid by</th><th>Shared by</th>"}<th class="n">Amount</th><th class="n">PHP</th>${solo?"":`<th class="n">Outstanding</th>`}<th></th></tr>${ex.map(e=>`<tr${solo?"":` onclick="openExp('${e.id}')" title="Tap to settle"`}><td><span class="code">${esc(e.code)}</span></td><td>${esc(e.desc)}<div class="small">${esc(e.date)} · ${esc(e.mode)}${e.book?" · via "+esc(e.book):""}</div>${e.note?`<div class="small">Note: ${esc(e.note)}</div>`:""}${safeUrl(e.link)?`<div class="small"><a href="${esc(safeUrl(e.link))}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Receipt link</a></div>`:""}</td>${solo?"":`<td>${payTxt(e)}</td><td class="small">${shTxt(e)}</td>`}<td class="n">${esc(e.cur)} ${fmt(e.amount)}${e.cur==="PHP"||isPend(e)?"":`<div class="small">@ ${rt(e.rate)}</div>`}</td><td class="n">${isPend(e)?`<span class="pend">No converted rate yet</span>`:`<b>${fmt(ph(e))}</b>`}</td>${solo?"":`<td class="n">${stCell(e)}</td>`}<td class="n"><button class="x" onclick="event.stopPropagation();editExp('${e.id}')" style="color:var(--violet)">Edit</button><button class="x" onclick="event.stopPropagation();delExp('${e.id}')">Delete</button></td></tr>`).join("")}</table></div>
 <p style="text-align:right;margin:10px 0 0"><b>Total: PHP ${fmt(trip.expenses.reduce((s,e)=>s+ph(e),0))}</b>${pendN?` <span class="pend" style="max-width:none"> · ${pendN} without a converted rate not included</span>`:""}</p>${solo?"":`<p class="small" style="text-align:right;margin:4px 0 0">Tap an expense to settle it. Outstanding is the full amount still unpaid on that expense, including the payer\'s own share until you record it. Payments recorded under Settle payment go to the oldest expense first. Nothing is deducted automatically.</p>`}`:`<p class="empty">No expenses yet. Add the first one above.</p>`;
 const c=calc(trip.expenses);
 if(solo){$("#ov").innerHTML=pendBan+`<p style="margin:0"><b>Total spent: PHP ${fmt(c[P[0]].share)}</b></p>`}
 else{const T={recv:0,share:0,paid:0,out:0};P.forEach(n=>{for(const k in T)T[k]+=c[n][k]});
  $("#ov").innerHTML=pendBan+`<div class="wrap"><table><tr><th>Traveler</th><th class="n">Receivable</th><th class="n">Share</th><th class="n">Paid Amount</th><th class="n">Outstanding Balance</th></tr>${P.map(n=>`<tr><td>${esc(n)}</td><td class="n">${fmt(c[n].recv)}</td><td class="n">${fmt(c[n].share)}</td><td class="n">${fmt(c[n].paid)}</td><td class="n">${neg(c[n].out)}</td></tr>`).join("")}<tr><td><b>Total</b></td><td class="n"><b>${fmt(T.recv)}</b></td><td class="n"><b>${fmt(T.share)}</b></td><td class="n"><b>${fmt(T.paid)}</b></td><td class="n">–</td></tr></table></div>
  <p class="small" style="margin:8px 0 0">Nothing is deducted automatically. Receivable is what a traveler paid upfront, less payments they have received. Paid Amount is only what you record in Settle payment (full or partial), and Outstanding Balance is Share less Paid Amount. Red brackets mean they have paid more than their share.</p>`;
  $("#st").innerHTML=`<button onclick="openSettle()">Settle payment</button>`;if(mdlMode==="st")renderSettle();else if(mdlMode==="ex")renderExp()}
 $("#rc").innerHTML=showRc?`<div class="row"><button onclick="print()">Print / save as PDF</button><button class="ghost" onclick="png()">Download as image</button><button class="ghost" onclick="openM()">Edit selection</button><button class="ghost" onclick="hideRc()">Hide receipt</button></div>${pendN?`<p class="pend" style="max-width:none;margin:8px 0 0">${pendN} expense${pendN>1?"s":""} without a converted rate ${pendN>1?"are":"is"} left out of the receipts.</p>`:""}`:`<button onclick="openM()">Generate receipt</button>`;
 $("#slips").innerHTML=showRc?slips():"";fit();
}

/* ---------- receipts ---------- */
let expDebts=[],mdlExp=null,expSettle=false;
function openExp(id){mdlMode="ex";mdlExp=id;expSettle=false;renderExp();$("#mdl").classList.add("on")}
function toggleExpSettle(){expSettle=!expSettle;renderExp();if(expSettle){const el=$("#xs");if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"})}}
function renderExp(){const e=trip.expenses.find(x=>x.id===mdlExp);if(!e){closeM();return}
 const q=expStatus()[e.id],items=q.items,pays=(trip.payments||[]).filter(x=>x.eid===e.id),sh=shares(e),pm=payersOf(e);expDebts=items;
 const row=(k,v)=>`<dt>${k}</dt><dd>${v}</dd>`;
 const status=isPend(e)?`<span class="pend" style="max-width:none">Waiting for a converted rate</span>`:q.d<.005?"Nothing owed":q.u<.005?`<span class="ok">✓ Paid</span>`:`PHP ${fmt(q.u)} outstanding`;
 const settle=expSettle?`<div id="xs" class="blk"><h3 style="font-size:16px;margin-bottom:6px">Settle payment</h3>
 ${items.length?items.map((x,i)=>{const paid=x.amt-x.rem,done=x.rem<.005;return`<div class="crow"><label class="ck" style="flex:1"><input type="checkbox" ${done?"checked disabled":`onchange="recordExp(${i})"`}><span>${x.from===x.to?esc(x.from)+" (own share)":esc(x.from)+" pays "+esc(x.to)} <span class="small">owes ${fmt(x.amt)}${paid>.005?", paid "+fmt(paid):""}</span></span></label>${done?`<span class="ok" style="flex:none">✓ Paid</span>`:`<input id="ea${i}" type="number" step="any" inputmode="decimal" value="${r2(x.rem)}">`}</div>`}).join(""):isPend(e)?`<p class="empty"><span class="pend" style="max-width:none">No converted rate yet.</span> Add the rate first, then settle it here.</p>`:`<p class="empty">Nobody owes anything on this expense.</p>`}
 <p class="small" style="margin:6px 0 0">Change the amount first for a part payment, then tick it.</p>
 ${pays.length?`<h3 style="font-size:16px;margin:14px 0 6px">Payments recorded here</h3>`+pays.map(x=>`<label class="ck"><input type="checkbox" checked onchange="undoPay('${x.id}')">${esc(x.from)} paid ${esc(x.to)} <b>PHP ${fmt(x.amount)}</b> <span class="small">${esc(x.date)}</span></label>`).join(""):""}</div>`:"";
 $("#mc").innerHTML=`<h2 style="margin-bottom:4px">${esc(e.desc)}</h2><div class="small" style="margin-bottom:12px"><span class="code">${esc(e.code)}</span></div>
 <dl class="dl">${row("Date",esc(e.date))}${row("Mode of payment",esc(e.mode))}${e.book?row("Booked via",esc(e.book)):""}
 ${row("Amount",e.cur==="PHP"?`PHP ${fmt(e.amount)}`:isPend(e)?`${esc(e.cur)} ${fmt(e.amount)}`:`${esc(e.cur)} ${fmt(e.amount)} @ ${rt(e.rate)}`)}${e.cur==="PHP"?"":row("In PHP",isPend(e)?`<span class="pend" style="max-width:none">No converted rate yet</span>`:fmt(ph(e)))}
 ${row("Paid by",Object.keys(pm).map(n=>isPend(e)?esc(n):`${esc(n)} ${fmt(pm[n])}`).join("<br>"))}
 ${row("Shared by",Object.keys(sh).map(n=>isPend(e)?esc(n):`${esc(n)} ${fmt(sh[n])}`).join("<br>"))}
 ${e.items&&e.items.length?row("Items",e.items.map(i=>`${esc(i.name)}${i.orig?" ("+esc(i.orig)+")":""} ${fmt(i.amount)} <span class="small">${i.owners.map(esc).join(", ")}</span>`).join("<br>")):""}
 ${e.note?row("Note",esc(e.note)):""}${safeUrl(e.link)?row("Receipt",`<a href="${esc(safeUrl(e.link))}" target="_blank" rel="noopener noreferrer">Open link</a>`):""}
 ${trip.solo?"":row("Status",status)}</dl>${trip.solo?"":settle}
 <div class="row" style="margin-top:14px">${trip.solo?"":`<button onclick="toggleExpSettle()">${expSettle?"Hide settlement":"Settle payment"}</button>`}${isPend(e)?`<button class="ghost" onclick="closeM();editExp('${e.id}')">Add rate</button>`:""}<button class="ghost" onclick="closeM()">Close</button></div>`}
function recordExp(i){const x=expDebts[i],a=parseFloat($("#ea"+i).value);
 if(!x||!(a>0)){lists();return toast("Enter the amount that was paid.")}
 if(a>x.rem+.005){lists();return toast("That is more than the outstanding PHP "+fmt(x.rem)+".")}
 (trip.payments=trip.payments||[]).push({id:uid(),from:x.from,to:x.to,amount:Math.round(a*100)/100,date:today(),eid:mdlExp});save(trip);lists();toast("Payment recorded")}
function openSettle(){mdlMode="st";renderSettle();$("#mdl").classList.add("on")}
function renderSettle(){const P=trip.people,pay=trip.payments||[],c=calc(trip.expenses),xs=expStatus();
 const selfPaid=n=>pay.filter(x=>x.from===n&&x.to===n).reduce((t,x)=>t+x.amount,0);
 $("#mc").innerHTML=`<h2 style="margin-bottom:10px">Settle payment</h2>
 <p class="small" style="margin:0 0 10px">Nothing is deducted automatically. Balances only change when you record a payment here.</p>
 <h3 style="font-size:16px;margin-bottom:6px">Outstanding by traveler</h3>
 ${P.map((n,i)=>{const le=Math.round((selfDebt(n,xs)-selfPaid(n))*100)/100;return`<div class="crow"><span>${esc(n)}</span><span style="flex:none;text-align:right">${neg(c[n].out)}</span>${le>.005?`<button class="ghost" style="flex:none;padding:4px 10px;font-size:12px" onclick="lessOwn(${i})">Less own share (${fmt(le)})</button>`:""}</div>`}).join("")}
 <h3 style="font-size:16px;margin:14px 0 6px">Paid and settled</h3>${pay.length?pay.map(x=>`<label class="ck"><input type="checkbox" checked onchange="undoPay('${x.id}')">${x.from===x.to?esc(x.from)+" less own share":esc(x.from)+" paid "+esc(x.to)} <b>PHP ${fmt(x.amount)}</b> <span class="small">${esc(x.date)}${x.eid?" · "+esc((trip.expenses.find(y=>y.id===x.eid)||{}).code||""):""}</span></label>`).join(""):`<p class="empty">Nothing yet. Add a payment below, full or partial.</p>`}
 <div class="row" style="margin-top:14px"><select id="pf" style="width:auto">${P.map(n=>`<option>${esc(n)}</option>`).join("")}</select><span>paid</span><select id="pt" style="width:auto">${P.map((n,i)=>`<option${i===1?" selected":""}>${esc(n)}</option>`).join("")}</select><input id="pm" type="number" step="any" inputmode="decimal" placeholder="PHP amount" style="width:130px"><button class="ghost" onclick="addPay()">+ Add payment</button></div>
 <div class="row" style="margin-top:14px"><button class="ghost" onclick="closeM()">Close</button></div>`}
function lessOwn(i){const n=trip.people[i],c=calc(trip.expenses)[n],pay=trip.payments||[],sp=pay.filter(x=>x.from===n&&x.to===n).reduce((t,x)=>t+x.amount,0),a=Math.round((selfDebt(n)-sp)*100)/100;
 if(!(a>.005))return;(trip.payments=pay).push({id:uid(),from:n,to:n,amount:a,date:today()});save(trip);lists();toast("Own share deducted for "+n)}
function hideRc(){showRc=false;lists()}
function closeM(){mdlMode=null;mdlExp=null;$("#mdl").classList.remove("on")}
function selAll(cls,c){document.querySelectorAll("."+cls).forEach(x=>x.checked=c)}
function openM(){const P=trip.people,ex=[...trip.expenses].filter(e=>!isPend(e)).sort(byCode),solo=!!trip.solo;
 const ckw=(k,l)=>`<label class="ck"><input type="checkbox" class="cw" data-k="${esc(k)}" ${exclWho.has(k)?"":"checked"}>${esc(l)}</label>`;
 const per=n=>{const mine=ex.filter(e=>(shares(e)[n]||0)>0||payersOf(e)[n]);return`<details><summary>${esc(n)}</summary>${mine.map(e=>`<label class="ck"><input type="checkbox" class="cp" data-n="${esc(n)}" data-k="${e.id}" ${exclPer[n]&&exclPer[n].has(e.id)?"":"checked"}>${esc(e.code)} ${esc(e.desc)}</label>`).join("")||`<p class="small">No expenses.</p>`}</details>`};
 $("#mc").innerHTML=`<h2 style="margin-bottom:10px">Generate receipt</h2>${trip.expenses.some(isPend)?`<p class="pend" style="max-width:none;margin:0 0 8px">Expenses without a converted rate are left out.</p>`:""}
 <details open><summary>Travelers</summary><label class="ck"><input type="checkbox" checked onchange="selAll('cw',this.checked)">Select all</label>${solo?"":ckw("_t","Total (everyone)")}${P.map(n=>ckw(n,n)).join("")}</details>
 <details><summary>Expenses included for everyone</summary><label class="ck"><input type="checkbox" checked onchange="selAll('ce',this.checked)">Select all</label>${ex.map(e=>`<label class="ck"><input type="checkbox" class="ce" data-k="${e.id}" ${exclEx.has(e.id)?"":"checked"}>${esc(e.code)} ${esc(e.desc)}</label>`).join("")||`<p class="small">No expenses yet.</p>`}</details>
 ${solo?"":`<details><summary>Include or exclude per traveler</summary>${P.map(per).join("")}</details>`}
 <div class="row" style="margin-top:12px"><button onclick="applyRc()">Show receipts</button><button class="ghost" onclick="closeM()">Cancel</button></div>`;
 mdlMode="rc";$("#mdl").classList.add("on")}
function applyRc(){exclWho.clear();exclEx.clear();for(const k in exclPer)delete exclPer[k];
 document.querySelectorAll(".cw").forEach(x=>{if(!x.checked)exclWho.add(x.dataset.k)});
 document.querySelectorAll(".ce").forEach(x=>{if(!x.checked)exclEx.add(x.dataset.k)});
 document.querySelectorAll(".cp").forEach(x=>{if(!x.checked)(exclPer[x.dataset.n]=exclPer[x.dataset.n]||new Set()).add(x.dataset.k)});
 showRc=true;closeM();lists();$("#slips").scrollIntoView({behavior:"smooth",block:"start"})}
const expFor=n=>trip.expenses.filter(e=>!isPend(e)&&!exclEx.has(e.id)&&!(exclPer[n]&&exclPer[n].has(e.id))).sort(byCode);
function head(t){return`<h3>${esc(trip.name)}</h3><div class="c">${esc(trip.country)} · ${esc(t)}</div><div class="c">${dTxt(trip)||new Date().toLocaleDateString("en-GB")}</div><hr>`}
function lineItems(e,n){const sh=shares(e);if(!((sh[n]||0)>0))return[];
 if(e.items&&e.items.length){const tot=ph(e),sum=e.items.reduce((s,i)=>s+i.amount,0)||1,r=[];e.items.forEach(i=>{const ow=i.owners.length?i.owners:e.share;if(ow.includes(n))r.push({t:e.desc+": "+i.name,a:i.amount/sum*tot/ow.length})});return r}
 return[{t:e.desc,a:sh[n]}]}
const ln=(t,b,a)=>`<div class="ln fit"><span>${esc(t)}${b?" - "+esc(b):""}</span><span>${fmt(a)}</span></div>`;
const tb=c=>`<div class="ln"><span>Share</span><span>PHP ${fmt(c.share)}</span></div><div class="ln"><span>Amount Paid</span><span>PHP ${fmt(c.paid)}</span></div><div class="ln tot"><span>Outstanding Balance</span><span>${c.out<-.005?`<span class="neg">(PHP ${fmt(-c.out)})</span>`:"PHP "+fmt(Math.abs(c.out)<.005?0:c.out)}</span></div>`;
function slips(){const out=[],gx=trip.expenses.filter(e=>!isPend(e)&&!exclEx.has(e.id)).sort(byCode);
 if(!trip.solo&&!exclWho.has("_t"))out.push(totalSlip(gx));
 trip.people.filter(n=>!exclWho.has(n)).forEach(n=>out.push(personSlip(n,expFor(n))));
 return out.join("")||`<p class="empty">No receipts selected.</p>`}
function personSlip(n,ex){const c=calc(ex)[n],lines=[];ex.forEach(e=>lineItems(e,n).forEach(l=>lines.push(ln(l.t,e.book,l.a))));
 return`<div class="slip">${head("Receipt")}<div class="nm">${esc(n)}</div><hr>${lines.join("")||`<div class="c">No shared expenses</div>`}<hr>${tb(c)}<hr><div class="c">Thank you!</div></div>`}
function totalSlip(ex){const c=calc(ex),tot=ex.reduce((s,e)=>s+ph(e),0);
 return`<div class="slip">${head("Trip receipt")}${ex.map(e=>ln(e.desc,e.book,ph(e))).join("")||`<div class="c">No expenses</div>`}<hr><div class="ln tot"><span>TOTAL</span><span>PHP ${fmt(tot)}</span></div><hr>
 ${trip.people.map(n=>`<div class="nm">${esc(n)}</div>${tb(c[n])}<hr>`).join("")}<div class="c">Thank you!</div></div>`}
function fit(){document.querySelectorAll(".slip .fit").forEach(el=>{let fs=13,g=0;el.style.fontSize=fs+"px";while(el.scrollWidth>el.clientWidth+1&&fs>7&&g++<40){fs-=.5;el.style.fontSize=fs+"px"}})}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
async function png(){
 const nodes=[...document.querySelectorAll(".slip")];if(!nodes.length)return toast("Nothing to download.");
 for(let i=0;i<nodes.length;i++){const cv=await html2canvas(nodes[i],{backgroundColor:"#ffffff",scale:2});const a=document.createElement("a");a.download=`${tripCode(trip)}-receipt-${i+1}.png`;a.href=cv.toDataURL("image/png");a.click()}
}
topbar();home();
</script>
</body></html>
